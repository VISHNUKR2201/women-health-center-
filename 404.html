<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Curevo Women's Health Center</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>

    <style>
        :root {
            --color-bg-dark: #081710;
            --color-card-dark: #12281e;
            --color-primary-lime: #8ef062;
            --color-text-main: #ffffff;
            --color-text-muted: #a4bea9;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg-dark);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 24px;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow-1 {
            top: 10%;
            left: 20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(142, 240, 98, 0.12) 0%, transparent 70%);
        }

        .ambient-glow-2 {
            bottom: 10%;
            right: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(20, 56, 38, 0.45) 0%, transparent 70%);
        }

        /* 404 Container Card */
        .error-card {
            position: relative;
            z-index: 10;
            max-width: 620px;
            width: 100%;
            background: rgba(18, 40, 30, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(142, 240, 98, 0.18);
            border-radius: 32px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6),
                        0 0 35px rgba(142, 240, 98, 0.08);
            animation: cardEntrance 0.9s var(--ease-out-expo) forwards;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-box {
            display: inline-block;
            margin-bottom: 28px;
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: scale(1.05);
        }

        .logo-img {
            height: 48px;
            width: auto;
            max-width: 200px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
        }

        /* 404 Big Number */
        .error-code-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .error-code {
            font-family: var(--font-serif);
            font-size: clamp(5.5rem, 12vw, 8rem);
            font-weight: 700;
            color: var(--color-primary-lime);
            line-height: 1;
            letter-spacing: -0.04em;
            text-shadow: 0 0 35px rgba(142, 240, 98, 0.35);
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(142, 240, 98, 0.12);
            border: 1px solid rgba(142, 240, 98, 0.25);
            color: var(--color-primary-lime);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 9999px;
            margin-bottom: 18px;
        }

        .error-title {
            font-family: var(--font-serif);
            font-size: clamp(1.8rem, 3.2vw, 2.3rem);
            font-weight: 500;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 14px;
        }

        .error-desc {
            font-size: 1.02rem;
            color: var(--color-text-muted);
            line-height: 1.6;
            margin-bottom: 36px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Buttons Row */
        .actions-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-goback {
            background: var(--color-primary-lime);
            color: #07190e;
            border: none;
            cursor: pointer;
            padding: 14px 32px;
            border-radius: 9999px;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 0.98rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.35s var(--ease-out-expo);
            box-shadow: 0 8px 24px rgba(142, 240, 98, 0.35);
        }

        .btn-goback:hover {
            background: #a3f77f;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(142, 240, 98, 0.5);
        }

        .btn-goback i {
            font-size: 1.15rem;
            transition: transform 0.3s ease;
        }

        .btn-goback:hover i {
            transform: translateX(-4px);
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 14px 28px;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.98rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: rgba(142, 240, 98, 0.15);
            border-color: var(--color-primary-lime);
            color: var(--color-primary-lime);
            transform: translateY(-3px);
        }

        .btn-home i {
            font-size: 1.15rem;
        }

        /* Footer info */
        .footer-note {
            margin-top: 36px;
            font-size: 0.85rem;
            color: #6b8573;
        }

        .footer-note strong {
            color: #8fa896;
        }

        @media (max-width: 540px) {
            .error-card {
                padding: 40px 24px;
            }
            .actions-row {
                flex-direction: column;
                width: 100%;
            }
            .btn-goback, .btn-home {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <div class="error-card">
        <!-- Logo -->
        <a href="index.html" class="logo-box" aria-label="Curevo Women's Health Center">
            <img src="images/logo.webp" alt="Curevo" class="logo-img">
        </a>

        <div class="error-badge">
            <i class="ri-heart-pulse-fill"></i>
            <span>Care Sanctuary</span>
        </div>

        <div class="error-code-wrap">
            <h1 class="error-code">404</h1>
        </div>

        <h2 class="error-title">Page Not Found</h2>
        <p class="error-desc">
            The wellness resource or page you are looking for has been relocated or is temporarily unavailable. Let us guide you back to our care services.
        </p>

        <div class="actions-row">
            <button type="button" onclick="goBackToPrevious()" class="btn-goback">
                <i class="ri-arrow-left-line"></i>
                <span>Go Back</span>
            </button>
            <a href="index.html" class="btn-home">
                <i class="ri-home-4-line"></i>
                <span>Back to Homepage</span>
            </a>
        </div>

        <div class="footer-note">
            MMR complex, salem, tamilnadu &bull; <strong>Curevo Healthcare</strong>
        </div>
    </div>

    <script>
        function goBackToPrevious() {
            var fromUrl = sessionStorage.getItem('curevo_from_url');
            sessionStorage.setItem('curevo_returning_from_404', '1');
            if (fromUrl) {
                window.location.href = fromUrl;
            } else if (window.history.length > 1) {
                window.history.back();
            } else if (document.referrer && document.referrer.length > 0) {
                window.location.href = document.referrer;
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
